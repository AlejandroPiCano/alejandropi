name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
      - name: Assemble site artifact
        # Publish only public site files; keep internal config (.claude, .agents, etc.) out of the deployed site
        run: |
          mkdir _site
          cp -r css js images _site/
          cp index.html robots.txt sitemap.xml CNAME app-ads.txt _site/
      - name: Inject GA measurement ID
        # Keep G-XXXXXXXX out of the public git repo; inject only into the Pages artifact.
        # Required: repo Settings → Secrets and variables → Actions → GA_MEASUREMENT_ID
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          if [ -z "$GA_MEASUREMENT_ID" ]; then
            echo "::error::Missing secret GA_MEASUREMENT_ID."
            echo "Create it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name must be exactly: GA_MEASUREMENT_ID"
            echo "Value must be your GA4 Measurement ID (G-XXXXXXXX)."
            echo "Then re-run this workflow."
            exit 1
          fi
          if [[ ! "$GA_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "::error::GA_MEASUREMENT_ID must look like G-XXXXXXXX (invalid value)."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          measurement_id = os.environ["GA_MEASUREMENT_ID"]
          path = Path("_site/js/analytics.js")
          text = path.read_text(encoding="utf-8")
          placeholder = "__GA_MEASUREMENT_ID__"
          if placeholder not in text:
              raise SystemExit("analytics.js placeholder missing; refusing to deploy")
          path.write_text(text.replace(placeholder, measurement_id), encoding="utf-8")
          print("Injected GA measurement ID into analytics.js")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4